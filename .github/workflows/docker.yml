name: Docker multi-platform
on:
  push:
    branches: ['main']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build runtime regression image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: agibot-x2:runtime-test
      - name: Check unprivileged SSH initialization and authentication
        shell: bash
        run: |
          fixture_dir="$(mktemp -d)"
          printf 'X2_SSH_HOST=127.0.0.1\nX2_SSH_USER=agi\nX2_SSH_PASSWORD=fixture-only\n' > "$fixture_dir/config.env"
          docker run --rm --network none --entrypoint python \
            --mount "type=bind,source=$fixture_dir/config.env,target=/run/secrets/x2_config,readonly" \
            -e X2_ENV_FILE=/run/x2/config.env \
            -e X2_SSH_KNOWN_HOSTS=/data/ssh/known_hosts \
            agibot-x2:runtime-test /app/docker/test_runtime.py
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - name: Check Compose startup without robot settings
        run: |
          python -m pip install -r x2_motion/requirements-dashboard.txt
          python docker/test_compose.py
      - uses: docker/login-action@v3
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' }}
          tags: ghcr.io/mps0927/agibot-x2:${{ github.ref_name }}
